<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chapelTitle">
  <title id="chapelTitle">Illustration of a meetinghouse chapel with a steeple at sunrise</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e7cf" />
      <stop offset="100%" stop-color="#fbf7ee" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#sky)" />
  <circle cx="480" cy="150" r="70" fill="#f0d9a8" />
  <rect x="0" y="420" width="960" height="120" fill="#cfead0" />

  <!-- Steeple -->
  <rect x="455" y="80" width="50" height="120" fill="#4b3a26" />
  <polygon points="480,20 435,90 525,90" fill="#3a2c1c" />
  <rect x="472" y="55" width="16" height="30" fill="#f0d9a8" />

  <!-- Main building -->
  <rect x="280" y="200" width="400" height="220" fill="#efe6d5" stroke="#4b3a26" stroke-width="4" />
  <polygon points="280,200 480,110 680,200" fill="#8a6d3b" />

  <!-- Doors -->
  <rect x="440" y="330" width="40" height="90" fill="#4b3a26" />
  <rect x="500" y="330" width="40" height="90" fill="#4b3a26" />

  <!-- Windows -->
  <rect x="330" y="250" width="40" height="60" fill="#c9a86a" stroke="#4b3a26" stroke-width="3" />
  <rect x="590" y="250" width="40" height="60" fill="#c9a86a" stroke="#4b3a26" stroke-width="3" />

  <!-- Path -->
  <polygon points="440,420 540,420 560,540 420,540" fill="#e4dcc6" />
</svg>
